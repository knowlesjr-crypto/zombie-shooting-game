<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zombie Siege Prototype 2</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #050a12;
      color: white;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(#0b1220, #04070d);
    }

    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .panel {
      position: absolute;
      background: rgba(7, 12, 18, 0.7);
      border: 1px solid rgba(84, 239, 152, 0.7);
      border-radius: 10px;
      padding: 12px 16px;
      box-shadow: 0 0 20px rgba(35, 255, 133, 0.2);
    }

    #topLeft {
      top: 18px;
      left: 18px;
      min-width: 220px;
    }

    #topRight {
      top: 18px;
      right: 18px;
      min-width: 220px;
      text-align: right;
    }

    #bottomLeft {
      left: 18px;
      bottom: 18px;
      min-width: 220px;
    }

    #bottomRight {
      right: 18px;
      bottom: 18px;
      min-width: 200px;
      text-align: right;
    }

    .stat {
      font-size: 18px;
      margin: 4px 0;
      color: #bafad4;
    }

    .label {
      display: inline-block;
      width: 90px;
      color: #7de2a5;
    }

    .healthbar, .ammobar {
      width: 200px;
      height: 18px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(127,255,212,0.8);
      border-radius: 6px;
      overflow: hidden;
      margin: 8px 0 4px;
    }

    .healthfill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #33ff88, #13b05d);
    }

    .ammofill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ffd166, #ff9f1c);
    }

    #crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 28px;
      height: 28px;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .line {
      position: absolute;
      background: rgba(80, 255, 170, 1);
      box-shadow: 0 0 12px rgba(80,255,170,0.7);
    }

    .h { width: 12px; height: 2px; left: 8px; top: 13px; }
    .v { width: 2px; height: 12px; left: 13px; top: 8px; }
    .dot {
      position: absolute;
      width: 6px;
      height: 6px;
      left: 11px;
      top: 11px;
      border-radius: 50%;
      background: #ff4d4d;
      box-shadow: 0 0 12px rgba(255, 77, 77, 0.8);
    }

    #waveModal {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(8, 12, 18, 0.92);
      border: 2px solid rgba(255, 97, 196, 0.8);
      border-radius: 18px;
      text-align: center;
      min-width: 420px;
      padding: 28px 36px;
      box-shadow: 0 0 30px rgba(255, 97, 196, 0.2);
      display: none;
    }

    #waveModal.active {
      display: block;
    }

    .waveTitle {
      font-size: 42px;
      color: #ff73d9;
      margin-bottom: 12px;
      text-shadow: 0 0 20px rgba(255, 115, 217, 0.6);
    }

    .waveText {
      font-size: 20px;
      color: #d9f7ff;
      margin: 10px 0;
    }

    .waveToken {
      font-size: 22px;
      color: #ffd166;
      margin: 12px 0;
    }

    #shopModal {
      position: absolute;
      inset: 0;
      background: rgba(3, 5, 10, 0.94);
      display: none;
      z-index: 10;
      overflow: auto;
    }

    #shopModal.active {
      display: block;
    }

    .shopWrap {
      position: relative;
      max-width: 1200px;
      margin: 50px auto;
      padding: 20px;
    }

    .shopHead {
      text-align: center;
      font-size: 42px;
      color: #7ef0ff;
      margin-bottom: 18px;
    }

    .shopTokens {
      text-align: center;
      font-size: 22px;
      color: #ffd166;
      margin-bottom: 24px;
    }

    .shopGrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 18px;
    }

    .shopItem {
      background: rgba(19, 28, 38, 0.85);
      border: 2px solid rgba(126, 240, 255, 0.6);
      border-radius: 16px;
      padding: 18px 14px;
      text-align: center;
      color: white;
    }

    .itemName {
      font-size: 22px;
      color: #9ef6ff;
      margin-bottom: 8px;
    }

    .itemPrice {
      font-size: 18px;
      color: #ffd166;
      margin-bottom: 10px;
    }

    .itemButton {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 16px;
      font-weight: bold;
      background: #52d7ff;
      color: #051722;
      cursor: pointer;
    }

    .itemButton:disabled {
      background: #5b6470;
      color: #d5dde5;
      cursor: not-allowed;
    }

    .closeShop {
      position: absolute;
      right: 20px;
      top: 10px;
      font-size: 34px;
      cursor: pointer;
      color: #ff77b6;
    }

    #gameOver {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(13, 5, 8, 0.94);
      border: 2px solid rgba(255, 90, 90, 0.8);
      border-radius: 16px;
      min-width: 420px;
      padding: 30px;
      text-align: center;
      display: none;
      box-shadow: 0 0 35px rgba(255, 90, 90, 0.25);
    }

    #gameOver.active {
      display: block;
    }

    .overTitle {
      font-size: 48px;
      color: #ff6b6b;
      margin-bottom: 18px;
    }

    .overStat {
      font-size: 20px;
      color: #ffe5a8;
      margin: 8px 0;
    }

    .restartBtn {
      margin-top: 24px;
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      background: #ff6b6b;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .notice {
      position: absolute;
      left: 50%;
      top: 120px;
      transform: translateX(-50%);
      background: rgba(10, 18, 12, 0.8);
      border: 1px solid rgba(0,255,170,0.7);
      color: #8ff0cc;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 18px;
      pointer-events: none;
      animation: fade 2.4s ease forwards;
    }

    @keyframes fade {
      0% { opacity: 0; transform: translate(-50%, -10px); }
      20%, 80% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -10px); }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div id="topLeft" class="panel">
      <div class="stat"><span class="label">WAVE</span> <span id="waveNum">1</span></div>
      <div class="stat"><span class="label">ZOMBIES</span> <span id="zombieCount">0</span></div>
      <div class="stat"><span class="label">KILLS</span> <span id="killCount">0</span></div>
      <div class="stat"><span class="label">SCORE</span> <span id="scoreCount">0</span></div>
    </div>

    <div id="topRight" class="panel">
      <div class="stat"><span class="label">TOKENS</span> <span id="tokenCount">0</span> 🪙</div>
      <div class="healthbar"><div id="healthFill" class="healthfill"></div></div>
      <div class="stat"><span id="healthText">100</span> / 100 HP</div>
    </div>

    <div id="bottomLeft" class="panel">
      <div class="stat"><span class="label">GUN</span> <span id="weaponName">Rifle</span></div>
      <div class="ammobar"><div id="ammoFill" class="ammofill"></div></div>
      <div class="stat"><span id="ammoText">30</span> / <span id="ammoMax">30</span></div>
      <div class="stat" style="color:#ffd166;">R to reload</div>
    </div>

    <div id="bottomRight" class="panel">
      <div class="stat">WASD Move</div>
      <div class="stat">Mouse Aim</div>
      <div class="stat">Click Shoot</div>
      <div class="stat">Shift Sprint</div>
      <div class="stat">P Shop</div>
    </div>

    <div id="crosshair">
      <div class="line h"></div>
      <div class="line v"></div>
      <div class="dot"></div>
    </div>
  </div>

  <div id="waveModal">
    <div class="waveTitle" id="waveTitle">WAVE 1</div>
    <div class="waveText" id="waveMessage">Prepare yourself</div>
    <div class="waveToken" id="waveReward">🪙 1,000,000</div>
    <div class="waveText" id="waveCountdown">Starting in 3...</div>
  </div>

  <div id="shopModal">
    <div class="shopWrap">
      <div class="closeShop" onclick="closeShop()">✕</div>
      <div class="shopHead">ZOMBIE SKINS</div>
      <div class="shopTokens">Tokens: <span id="shopTokens">0</span> 🪙</div>
      <div id="shopGrid" class="shopGrid"></div>
    </div>
  </div>

  <div id="gameOver">
    <div class="overTitle">YOU DIED</div>
    <div class="overStat">Wave Survived: <span id="finalWave">1</span></div>
    <div class="overStat">Kills: <span id="finalKills">0</span></div>
    <div class="overStat">Score: <span id="finalScore">0</span></div>
    <div class="overStat">Tokens: <span id="finalTokens">0</span></div>
    <button class="restartBtn" onclick="restartGame()">RESTART</button>
  </div>
</body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="prototype2.js"></script>
</html>
